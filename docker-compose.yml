version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psi-postgres
    environment:
      POSTGRES_DB: psi_db
      POSTGRES_USER: psi_user
      POSTGRES_PASSWORD: psi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psi_user -d psi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psi-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://psi_user:psi_password@postgres:5432/psi_db
      JWT_SECRET: ${JWT_SECRET:-psi-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: 24h
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psi-frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
